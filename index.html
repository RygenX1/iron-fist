<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Iron Squad | Daily Habit Engine</title>

  <!-- PWA & Mobile Web Capabilities -->
  <meta name="theme-color" content="#07090E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Iron Squad">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bg: '#07090E',
            surface: '#0D111A',
            panel: '#131824',
            border: '#1E2638',
            brand: '#10B981',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #07090E;
      color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      user-select: none;
    }
    .tabular { font-variant-numeric: tabular-nums; }
    .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(0.75rem, env(safe-area-inset-top)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand/20">

  <!-- Network Offline Banner -->
  <div id="offline-bar" class="hidden bg-amber-500/10 border-b border-amber-500/20 px-3 py-1.5 text-center">
    <span class="text-[11px] font-mono font-bold text-amber-400">Offline mode: Changes will sync once connected</span>
  </div>

  <!-- ================= AUTH VIEW ================= -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-surface border border-border rounded-2xl p-6 shadow-2xl">
      <div class="flex items-center gap-2 mb-6">
        <div class="w-2.5 h-2.5 rounded-full bg-brand animate-pulse"></div>
        <span class="font-mono text-[11px] uppercase tracking-widest text-slate-400 font-bold">Iron Squad Access</span>
      </div>
      <h1 class="text-xl font-bold text-white mb-1.5">Squad Sign In</h1>
      <p class="text-xs text-slate-400 mb-6">Enter your squad email & password to sync records.</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-[10px] font-mono uppercase text-slate-400 mb-1">Squad Email</label>
          <input type="email" id="login-email" required placeholder="name@squad.com" autocomplete="email" class="w-full bg-bg border border-border rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand transition-colors">
        </div>
        <div>
          <label class="block text-[10px] font-mono uppercase text-slate-400 mb-1">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" class="w-full bg-bg border border-border rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand transition-colors">
        </div>
        <button type="submit" id="login-btn" class="w-full bg-brand hover:bg-emerald-400 text-bg font-bold py-3.5 rounded-xl text-xs font-mono tracking-wide transition-all active:scale-[0.98]">
          AUTHENTICATE
        </button>
      </form>
      <div id="auth-error" class="hidden mt-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-mono"></div>
    </div>
  </div>

  <!-- ================= MAIN APP VIEW ================= -->
  <div id="app-screen" class="hidden flex-1 flex flex-col pb-36">
    <!-- Header -->
    <header class="border-b border-border bg-surface/80 backdrop-blur sticky top-0 z-40 px-4 py-3 safe-top">
      <div class="max-w-md mx-auto flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
          <span class="font-mono text-xs font-bold tracking-wider text-slate-200">IRON SQUAD</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="user-display-name" class="text-xs font-semibold text-slate-300 font-mono">...</span>
          <button id="logout-btn" class="text-xs font-mono text-slate-500 hover:text-slate-300 transition-colors">Sign Out</button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full px-4 pt-4 space-y-5">
      
      <!-- Horizon Date Rail -->
      <section>
        <div class="flex items-center justify-between mb-2">
          <span class="text-[10px] font-mono uppercase tracking-wider text-slate-400">Horizon (Cutoff 12:00 AM IST)</span>
          <span id="active-day-indicator" class="text-[10px] font-mono text-brand font-bold">TODAY</span>
        </div>
        <div id="horizon-rail" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
          <!-- Dynamically Injected Date Chips -->
        </div>
      </section>

      <!-- Selected Day Status Card -->
      <section class="bg-surface border border-border rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3 border-b border-border/40 pb-2.5">
          <div class="flex items-center gap-2">
            <span id="status-card-badge" class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-slate-800 text-slate-400">TODAY</span>
            <span id="status-card-date" class="font-mono text-xs text-slate-300">...</span>
          </div>
          <div id="squad-readiness-count" class="text-[10px] font-mono text-slate-400 tabular">0 / 0 Ready</div>
        </div>

        <!-- Squad Grid -->
        <div id="squad-roster" class="grid grid-cols-2 gap-2">
          <!-- Dynamically Injected Member Cards -->
        </div>
      </section>

      <!-- Leaderboard -->
      <section class="bg-surface border border-border rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3 border-b border-border/40 pb-2">
          <span class="font-mono text-xs uppercase tracking-wider text-slate-400 font-bold">Standings</span>
          <div class="flex gap-2 text-[10px] font-mono">
            <button id="tab-weekly" class="text-brand font-bold">WEEKLY</button>
            <span class="text-slate-700">|</span>
            <button id="tab-alltime" class="text-slate-500 hover:text-slate-300">ALL-TIME</button>
          </div>
        </div>
        <div id="leaderboard-list" class="space-y-1">
          <!-- Dynamically Injected Leaderboard Rows -->
        </div>
      </section>

    </main>

    <!-- Fixed Bottom Thumb Zone Dock -->
    <div class="fixed bottom-0 left-0 right-0 z-50 bg-bg/95 backdrop-blur-md border-t border-border px-4 pt-3 safe-bottom">
      <div class="max-w-md mx-auto" id="dock-actions">
        <!-- Injected Action Levers -->
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-xl text-xs font-mono font-bold border transition-all duration-300 shadow-2xl"></div>

  <script>
    // ================= 1. CONFIGURATION =================
    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        storageKey: 'iron_squad_auth'
      }
    });

    // ================= 2. TIMEZONE & CHRONOLOGY HELPERS =================
    // Always calculate Indian Standard Time (IST) explicitly to prevent UTC drift between 12:00 AM & 5:30 AM
    function getNowIST() {
      const now = new Date();
      const istString = now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
      return new Date(istString);
    }

    function getISTDateString(offsetDays = 0) {
      const d = getNowIST();
      d.setDate(d.getDate() + offsetDays);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // App State
    let currentUser = null;
    let members = [];
    let logs = [];
    let selectedDate = getISTDateString(0);
    let leaderboardView = 'weekly';

    function showToast(text, isError = false) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-xs font-mono font-bold border shadow-2xl transition-all duration-200 ${
        isError ? 'bg-rose-950/90 border-rose-500 text-rose-300' : 'bg-emerald-950/90 border-emerald-500 text-emerald-300'
      }`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3200);
      if (navigator.vibrate) navigator.vibrate(isError ? [30, 30] : [12]);
    }

    // ================= 3. AUTHENTICATION & SESSION RESTORE =================
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const btn = document.getElementById('login-btn');
      const errorDiv = document.getElementById('auth-error');

      btn.disabled = true;
      btn.innerText = 'AUTHENTICATING...';
      errorDiv.classList.add('hidden');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorDiv.innerText = error.message;
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'AUTHENTICATE';
      } else {
        currentUser = data.user;
        initApp();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.reload();
    });

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session && !currentUser) {
        currentUser = session.user;
        initApp();
      }
    });

    // ================= 4. DATA ENGINE =================
    async function initApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();
      
      document.getElementById('user-display-name').innerText = profile ? profile.display_name : currentUser.email.split('@')[0];

      await fetchAllData();
      renderHorizonRail();
      renderApp();

      // Realtime synchronization across all devices
      supabaseClient.channel('squad-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'daily_logs' }, () => {
          fetchAllData().then(renderApp);
        })
        .subscribe();
    }

    async function fetchAllData() {
      const [lbRes, logsRes] = await Promise.all([
        supabaseClient.from('leaderboard_view').select('*'),
        supabaseClient.from('daily_logs')
          .select('*')
          .gte('target_date', getISTDateString(-3))
          .lte('target_date', getISTDateString(5))
      ]);

      if (lbRes.data) members = lbRes.data;
      if (logsRes.data) logs = logsRes.data;
    }

    // ================= 5. INTERFACE RENDERING =================
    function renderHorizonRail() {
      const rail = document.getElementById('horizon-rail');
      rail.innerHTML = '';
      const todayISO = getISTDateString(0);

      for (let i = 0; i < 5; i++) {
        const iso = getISTDateString(i);
        const isToday = i === 0;
        const isTmrw = i === 1;
        const label = isToday ? 'Today' : isTmrw ? 'Tmrw' : `+${i}d`;

        const parts = iso.split('-');
        const dateNum = `${parts[2]}/${parts[1]}`;

        const isSelected = selectedDate === iso;
        const btn = document.createElement('button');
        btn.className = `flex-shrink-0 px-3.5 py-2 rounded-xl font-mono border text-left transition-all ${
          isSelected 
            ? 'bg-panel border-brand text-brand shadow-sm' 
            : 'bg-surface border-border text-slate-400 hover:border-slate-700'
        }`;
        btn.innerHTML = `
          <div class="text-[9px] uppercase font-bold tracking-wider ${isSelected ? 'text-brand' : 'text-slate-500'}">${label}</div>
          <div class="text-xs font-semibold text-white tabular">${dateNum}</div>
        `;
        btn.onclick = () => {
          selectedDate = iso;
          document.getElementById('active-day-indicator').innerText = isToday ? 'TODAY' : isTmrw ? 'TOMORROW' : `DAY +${i}`;
          renderHorizonRail();
          renderApp();
        };
        rail.appendChild(btn);
      }
    }

    function renderApp() {
      const todayISO = getISTDateString(0);
      const isToday = selectedDate === todayISO;
      const isFuture = selectedDate > todayISO;

      document.getElementById('status-card-badge').innerText = isToday ? 'TODAY' : isFuture ? 'UPCOMING' : 'PAST';
      document.getElementById('status-card-date').innerText = selectedDate;

      const dayLogs = logs.filter(l => l.target_date === selectedDate);
      const readyCount = dayLogs.filter(l => l.committed === true).length;
      document.getElementById('squad-readiness-count').innerText = `${readyCount} / ${members.length} Ready`;

      // Render Squad Roster
      const rosterDiv = document.getElementById('squad-roster');
      rosterDiv.innerHTML = '';

      members.forEach(m => {
        const log = dayLogs.find(l => l.user_id === m.user_id);
        const isCommitted = log?.committed === true;
        const isAttended = log?.attended === true;
        const isMissed = log?.attended === false && log?.reconciled === true;

        let statusText = 'Resting';
        let statusBadge = 'bg-slate-800 text-slate-500 border-border';
        let indicatorColor = 'bg-slate-700';

        if (isToday) {
          if (isAttended) {
            statusText = `+${log.xp_awarded} XP`;
            statusBadge = 'bg-emerald-950/40 text-brand border-brand/30';
            indicatorColor = 'bg-brand';
          } else if (isMissed) {
            statusText = `${log.xp_awarded} XP`;
            statusBadge = 'bg-rose-950/40 text-rose-400 border-rose-500/30';
            indicatorColor = 'bg-rose-500';
          } else if (isCommitted) {
            statusText = 'Ready';
            statusBadge = 'bg-emerald-950/40 text-emerald-400 border-emerald-500/30';
            indicatorColor = 'bg-emerald-400 animate-pulse';
          }
        } else {
          if (isCommitted) {
            statusText = 'Locked In';
            statusBadge = 'bg-emerald-950/40 text-brand border-brand/30';
            indicatorColor = 'bg-brand';
          }
        }

        const isMe = m.user_id === currentUser.id;
        rosterDiv.innerHTML += `
          <div class="p-2.5 rounded-xl border bg-panel/40 ${isMe ? 'border-slate-600' : 'border-border'} flex items-center justify-between">
            <div class="flex items-center gap-2 overflow-hidden">
              <div class="w-2 h-2 rounded-full flex-shrink-0 ${indicatorColor}"></div>
              <span class="text-xs font-semibold ${isMe ? 'text-white' : 'text-slate-300'} font-mono truncate">${m.display_name}</span>
            </div>
            <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded border ${statusBadge}">${statusText}</span>
          </div>
        `;
      });

      // Render Leaderboard
      const lbDiv = document.getElementById('leaderboard-list');
      lbDiv.innerHTML = '';
      const sorted = [...members].sort((a, b) => 
        leaderboardView === 'weekly' ? b.weekly_xp - a.weekly_xp : b.total_xp - a.total_xp
      );

      sorted.forEach((m, idx) => {
        const xp = leaderboardView === 'weekly' ? m.weekly_xp : m.total_xp;
        const rankColor = idx === 0 ? 'text-amber-400' : idx === 1 ? 'text-slate-300' : idx === 2 ? 'text-amber-600' : 'text-slate-600';
        lbDiv.innerHTML += `
          <div class="flex items-center justify-between py-2 px-2.5 rounded-xl hover:bg-panel/40 transition-colors">
            <div class="flex items-center gap-2.5">
              <span class="font-mono text-xs font-bold ${rankColor} w-4 text-center">${idx + 1}</span>
              <span class="text-xs font-medium text-slate-200">${m.display_name}</span>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-[10px] font-mono text-slate-500">${m.total_sessions_crushed} done</span>
              <span class="font-mono text-xs font-bold text-brand tabular">${xp} XP</span>
            </div>
          </div>
        `;
      });

      renderDockAction();
    }

    function renderDockAction() {
      const dock = document.getElementById('dock-actions');
      const todayISO = getISTDateString(0);
      const isToday = selectedDate === todayISO;
      const isFuture = selectedDate > todayISO;
      const myLog = logs.find(l => l.user_id === currentUser.id && l.target_date === selectedDate);

      if (isToday) {
        if (myLog?.attended !== null && myLog?.attended !== undefined) {
          dock.innerHTML = `
            <div class="w-full flex items-center justify-between p-3 bg-panel border border-border rounded-xl">
              <div class="font-mono text-xs text-slate-400">
                Logged: <span class="text-brand font-bold">${myLog.xp_awarded > 0 ? '+' : ''}${myLog.xp_awarded} XP</span>
              </div>
              <button onclick="handleAttendance(${!myLog.attended})" class="text-[11px] font-mono text-slate-500 hover:text-slate-300 underline underline-offset-4">
                Change to ${myLog.attended ? 'Rest Day' : 'Crushed It'}
              </button>
            </div>
          `;
        } else {
          dock.innerHTML = `
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="handleAttendance(true)" class="w-full py-3.5 bg-brand hover:bg-emerald-400 text-bg font-bold rounded-xl text-xs font-mono transition-all active:scale-[0.98] shadow-lg shadow-brand/10">
                CRUSHED IT (+20)
              </button>
              <button onclick="handleAttendance(false)" class="w-full py-3.5 bg-panel hover:bg-slate-800 text-slate-300 border border-border font-bold rounded-xl text-xs font-mono transition-all active:scale-[0.98]">
                REST DAY (0)
              </button>
            </div>
          `;
        }
      } else if (isFuture) {
        const isCommitted = myLog?.committed === true;
        dock.innerHTML = `
          <button onclick="handleToggleRsvp('${selectedDate}', ${!isCommitted})" class="w-full py-3.5 rounded-xl text-xs font-mono font-bold transition-all active:scale-[0.98] border ${
            isCommitted 
              ? 'bg-rose-500/10 border-rose-500/30 text-rose-400 hover:bg-rose-500/20' 
              : 'bg-brand text-bg hover:bg-emerald-400'
          }">
            ${isCommitted ? 'CANCEL COMMITMENT (OPT OUT)' : 'LOCK IN FOR THIS DAY (+20 XP TARGET)'}
          </button>
        `;
      } else {
        dock.innerHTML = `
          <div class="w-full py-3 text-center font-mono text-xs text-slate-600 bg-surface/50 border border-border/40 rounded-xl">
            Past Record (Locked)
          </div>
        `;
      }
    }

    // ================= 6. MUTATION LEVERS =================
    async function handleToggleRsvp(targetDate, state) {
      const { data, error } = await supabaseClient.rpc('rpc_toggle_rsvp', {
        p_target_date: targetDate,
        p_committed: state
      });

      if (error || !data.success) {
        showToast(data?.error || error?.message, true);
      } else {
        showToast(state ? 'Locked in for the squad!' : 'Opted out safely.');
        await fetchAllData();
        renderApp();
      }
    }

    async function handleAttendance(didAttend) {
      const { data, error } = await supabaseClient.rpc('rpc_submit_attendance', {
        p_did_attend: didAttend
      });

      if (error || !data.success) {
        showToast(data?.error || error?.message, true);
      } else {
        showToast(`Attendance verified: ${data.xp_awarded > 0 ? '+' : ''}${data.xp_awarded} XP`);
        await fetchAllData();
        renderApp();
      }
    }

    // Leaderboard Tabs
    document.getElementById('tab-weekly').onclick = () => {
      leaderboardView = 'weekly';
      document.getElementById('tab-weekly').className = 'text-brand font-bold';
      document.getElementById('tab-alltime').className = 'text-slate-500 hover:text-slate-300';
      renderApp();
    };
    document.getElementById('tab-alltime').onclick = () => {
      leaderboardView = 'alltime';
      document.getElementById('tab-alltime').className = 'text-brand font-bold';
      document.getElementById('tab-weekly').className = 'text-slate-500 hover:text-slate-300';
      renderApp();
    };

    // Offline Listeners
    window.addEventListener('offline', () => document.getElementById('offline-bar').classList.remove('hidden'));
    window.addEventListener('online', () => {
      document.getElementById('offline-bar').classList.add('hidden');
      fetchAllData().then(renderApp);
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration skipped:', err));
      });
    }
  </script>
</body>
</html>
